<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPOSITORIO — LUGARES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="is-focused">

    <main class="paper-page">
        <header class="page-meta">
            <a href="./index.html" class="back-link">← MANIFIESTO</a>
            <span class="artist-full">REPOSITORIO</span>
        </header>

        <article class="manifesto-content-v2 repository-section">
            <h1 class="manifesto-title-v2">Archivo y Registros</h1>

            <!-- Elemento 1: Audio -->
            <section class="repo-item">
                <span class="repo-tag">AUDIO / ARCHIVO SONORO</span>
                <div class="audio-player-box">
                    <audio controls class="custom-audio">
                        <source src="./nico-tobi-queriendo-despertar.mp3" type="audio/mpeg">
                        Tu navegador no soporta el reproductor de audio.
                    </audio>
                </div>
                <p class="repo-caption">
                    Nico y Tobi cantando Queriendo despertar del Príncipe Pena, noviembre del 2025, San Javier.
                </p>
            </section>

            <div class="modern-separator">•</div>

            <!-- Elemento 2: Fotografía -->
            <section class="repo-item">
                <span class="repo-tag">FOTOGRAFÍA</span>
                <div class="repo-image-frame">
                    <img src="./cocina.jpg" alt="La cocina" class="repo-img">
                </div>
                <p class="repo-caption">
                    La cocina.
                </p>
            </section>
        </article>

        <footer class="page-footer-v2">
            <div class="footer-core">
                <span class="listen-label">LUGARES — MATEO FUERTES</span>
                <div class="listen-action">
                    <a href="./index.html" class="listen-link">VOLVER AL INICIO</a>
                </div>
            </div>
        </footer>
    </main>

</body>
</html>
